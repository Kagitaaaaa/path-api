basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: johndoe@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
      username:
        example: John Doe
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.SuccessResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  kelas.CreateKelasRequest:
    properties:
      nama:
        type: string
      tingkat:
        type: string
    required:
    - nama
    type: object
  kelas.ListKelasResponse:
    properties:
      dibuat:
        example: 2006-01-02T15:04:05Z07:00
        type: string
      id:
        example: 2
        type: integer
      kode_kelas:
        example: A18D23
        type: string
      nama:
        example: Pemrograman Dasar
        type: string
      pembuat:
        example: 1
        type: integer
      tingkat:
        example: SMA
        type: string
    type: object
  pengguna.GetPenggunaFailure400Response:
    properties:
      message:
        example: Data pengguna tidak ditemukan
        type: string
    type: object
  pengguna.GetPenggunaFailure401Response:
    properties:
      message:
        example: Tidak dapat mengakses data klaim
        type: string
    type: object
  pengguna.GetPenggunaSuccessResponse:
    properties:
      email:
        example: johndoe@example.com
        type: string
      id:
        example: 1
        type: integer
      phone:
        example: "123123123"
        type: string
      profile_picture:
        example: joe_mama.jpg
        type: string
      username:
        example: John Doe
        type: string
    type: object
  utils.HTTPResponse:
    properties:
      message:
        type: string
    type: object
host: api.patclass.app
info:
  contact: {}
  description: This is documentation for PATH API.
  license:
    name: Apache 2.0
    url: https://raw.githubusercontent.com/kelompokms/path-api/refs/heads/main/LICENSE
  title: PATH API Documentation
  version: "1.0"
paths:
  /kelas:
    get:
      consumes:
      - application/json
      description: List kelas menggunakan Bearer Token dan mengembalikan response
        list kelas
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/kelas.ListKelasResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: List Kelas
      tags:
      - Kelas
    post:
      consumes:
      - application/json
      description: Buat Kelas menggunakan nama dan tingkat dan mengembalikan message
      parameters:
      - description: Create Kelas Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/kelas.CreateKelasRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Buat Kelas
      tags:
      - Kelas
  /kelas/{kode_kelas}/gabung:
    post:
      consumes:
      - application/json
      description: Join Kelas menggunakan kode dan mengembalikan message
      parameters:
      - in: path
        name: kode_kelas
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Join Kelas
      tags:
      - Kelas
  /kelas/{kode_kelas}/keluar:
    post:
      consumes:
      - application/json
      description: Leave Kelas menggunakan kode dan mengembalikan message
      parameters:
      - in: path
        name: kode_kelas
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Leave Kelas
      tags:
      - Kelas
  /login:
    post:
      consumes:
      - application/json
      description: Login pengguna baru dengan Email dan Password, mengembalikan JWT
        token untuk Bearer Auth
      parameters:
      - description: Login Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Login pengguna
      tags:
      - Auth
  /pengguna:
    get:
      description: Mendapatkan informasi pengguna dengan parsing ID pengguna dari
        token
      parameters:
      - description: Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pengguna.GetPenggunaSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pengguna.GetPenggunaFailure400Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pengguna.GetPenggunaFailure401Response'
      summary: Mendapatkan informasi pengguna
      tags:
      - Pengguna
  /register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan pengguna baru dengan Username, Email dan Password,
        mengembalikan JWT token untuk Bearer Auth
      parameters:
      - description: Register Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Register pengguna baru
      tags:
      - Auth
swagger: "2.0"
